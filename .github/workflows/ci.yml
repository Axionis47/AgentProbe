name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentprobe
          POSTGRES_PASSWORD: agentprobe
          POSTGRES_DB: agentprobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENTPROBE_POSTGRES_HOST: localhost
      AGENTPROBE_POSTGRES_PORT: "5432"
      AGENTPROBE_POSTGRES_USER: agentprobe
      AGENTPROBE_POSTGRES_PASSWORD: agentprobe
      AGENTPROBE_POSTGRES_DB: agentprobe
      AGENTPROBE_REDIS_URL: redis://localhost:6379/0
      AGENTPROBE_LLM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create the test database
        run: |
          PGPASSWORD=agentprobe psql -h localhost -U agentprobe -d agentprobe -c "CREATE DATABASE agentprobe_test"

      - name: Lint with ruff (real-bug rules only — F + E9)
        working-directory: backend
        run: ruff check app/ --select F,E9

      - name: Run unit + integration tests
        working-directory: backend
        run: pytest tests/unit tests/integration -x --tb=short

  frontend:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: streamlit_app/requirements.txt

      - name: Install streamlit + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r streamlit_app/requirements.txt

      - name: Run page smoke tests
        run: pytest streamlit_app/tests -v
